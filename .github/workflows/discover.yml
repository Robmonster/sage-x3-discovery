name: Sage X3 discovery search
on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python discover.py
      - name: Commit updated discovery database
        run: |
          git config user.name "Sage X3 Discovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add candidates.json
          git diff --cached --quiet || git commit -m "Update Sage X3 discoveries"
          git push
